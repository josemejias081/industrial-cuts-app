<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndCut Pro | Optimizador de Cortes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/plate.css">
    <script>document.documentElement.dataset.theme = localStorage.getItem('indcut-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
</head>
<body class="grid-pattern p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex items-center justify-between border-b border-slate-800 pb-5">
            <a href="index.html" class="flex items-center gap-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-[#121212]" aria-label="IndCut Pro, inicio">
                <span class="rounded-lg bg-blue-600 p-2 text-white">
                    <i data-lucide="layers" class="h-6 w-6" aria-hidden="true"></i>
                </span>
                <span class="text-xl font-black tracking-tight text-white">IndCut<span class="text-blue-500">Pro</span></span>
            </a>
            <span class="hidden items-center gap-2 text-xs font-bold uppercase tracking-widest text-slate-500 sm:flex">
                <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
                Herramientas disponibles
            </span>
            <button type="button" onclick="toggleTheme()" class="theme-toggle rounded-xl border border-slate-700 p-2 text-slate-400 transition hover:border-blue-600 hover:text-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-600" aria-label="Cambiar a modo claro">
                <i data-lucide="sun" class="theme-dark-only h-5 w-5" aria-hidden="true"></i>
                <i data-lucide="moon" class="theme-light-only h-5 w-5" aria-hidden="true"></i>
            </button>
        </header>

        <header class="mt-6 mb-8 flex flex-col xl:flex-row justify-end items-center gap-6 bg-slate-900/50 p-8 rounded-[3rem] border border-slate-800 backdrop-blur-md">
            <div class="flex flex-wrap gap-4">
                <div class="bg-slate-800 p-3 px-5 rounded-2xl border border-slate-700 flex flex-col items-center">
                    <label for="tipoChapa" class="text-[10px] font-bold text-slate-400 uppercase italic">Tipo de chapa</label>
                    <select id="tipoChapa" onchange="cambiarTipoChapa()" class="bg-transparent text-sm font-black text-white outline-none text-center">
                        <option value="3000x1500">3000 x 1500 mm</option>
                        <option value="2000x1000">2000 x 1000 mm</option>
                    </select>
                </div>
                <div class="bg-slate-800 p-3 px-6 rounded-2xl border border-slate-700 flex flex-col items-center">
                    <span class="text-[10px] font-bold text-slate-500 uppercase italic">Costo $</span>
                    <input type="number" id="precioTablero" value="50" onchange="calcular2D()" class="bg-transparent text-xl font-black text-white w-20 outline-none text-center">
                </div>
                <div class="bg-slate-800 p-3 px-6 rounded-2xl border border-slate-700 flex flex-col items-center">
                    <span class="text-[10px] font-bold text-slate-500 uppercase italic">Kerf (mm)</span>
                    <input type="number" id="kerf" value="0" onchange="calcular2D()" class="bg-transparent text-xl font-black text-blue-400 w-12 outline-none text-center">
                </div>
                <div class="flex items-center gap-3 bg-slate-800 p-4 rounded-2xl border border-slate-700">
                    <span class="text-xs font-bold text-slate-400 italic">ROTAR</span>
                    <input type="checkbox" id="permiteRotar" checked onchange="calcular2D()" class="w-5 h-5 accent-blue-600">
                </div>
                <button onclick="limpiarTodo()" class="flex items-center gap-2 px-4 py-3 text-red-400 hover:bg-red-500/10 rounded-2xl transition font-bold uppercase text-xs">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Borrar todo
                </button>
            </div>
        </header>

        <div class="grid lg:grid-cols-12 gap-10">
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-slate-900 p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl">
                    <h2 class="text-xs font-black text-blue-500 mb-6 uppercase tracking-widest italic">Panel de Producción</h2>
                    <div class="space-y-4">
                        <input type="text" id="nombreP" placeholder="Describe la Pieza" class="w-full bg-slate-800 border border-slate-700 p-4 rounded-2xl text-white outline-none focus:border-blue-500">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="number" id="anchoP" placeholder="Largo (X)" class="w-full bg-slate-800 border border-slate-700 p-4 rounded-2xl text-white font-black">
                            <input type="number" id="altoP" placeholder="Ancho (Y)" class="w-full bg-slate-800 border border-slate-700 p-4 rounded-2xl text-white font-black">
                        </div>
                        <input type="number" id="cantP" value="1" class="w-full bg-slate-800 border border-slate-700 p-4 rounded-2xl text-white font-black">
                        <button onclick="agregarPieza()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-5 rounded-2xl shadow-xl transition-all">AÑADIR A LA LISTA</button>
                    </div>
                </div>
                <div id="listaPiezas" class="space-y-3 max-h-[300px] overflow-y-auto pr-2 custom-scrollbar"></div>
            </div>

            <div class="lg:col-span-8 space-y-8">
                <div id="stats" class="grid grid-cols-2 xl:grid-cols-4 gap-4 hidden"></div>
                <div id="planosCorte" class="space-y-12"></div>
                
                <div id="contenedorRetazos" class="hidden bg-emerald-900/10 border border-emerald-500/20 p-8 rounded-[3rem]">
                    <h3 class="text-emerald-500 font-black text-xs uppercase mb-6 italic">Retazos Recuperables (>300mm)</h3>
                    <div id="listaRetazos" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-emerald-400 font-mono text-sm"></div>
                </div>

                <button onclick="exportarPDF()" id="btnPDF" class="hidden w-full bg-white text-slate-900 py-6 rounded-[2rem] font-black text-xl hover:bg-blue-600 hover:text-white transition-all shadow-2xl flex justify-center items-center gap-3">
                    <i data-lucide="printer"></i> GENERAR PLANO TÉCNICO (PDF)
                </button>
            </div>
        </div>
         
    </div>

    <script src="js/common.js" defer></script>
    <script src="js/plate.js" defer></script>
</body>
</html>
